# TLS terminator for *.localtest.me -> Blocks services on the compose network.
# Static config rather than nginx-proxy autodiscovery: podman's docker socket is
# not mounted, and four upstreams do not justify the indirection.

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name ~^(?<svc>os|iam|data|logic)\.localtest\.me$;

    ssl_certificate     /etc/nginx/certs/localtest.me.crt;
    ssl_certificate_key /etc/nginx/certs/localtest.me.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    # proxy_pass with a variable is resolved per request, which needs an
    # explicit resolver. Written at container start by 10-resolver.sh from the
    # container's own resolv.conf — the address changes when the network is
    # recreated, so it must not be hardcoded.
    include /etc/nginx/resolver.conf;

    location / {
        proxy_pass http://$svc-api:5000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Emulated .NET is slow; do not cut requests short.
        proxy_connect_timeout 30s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }
}
